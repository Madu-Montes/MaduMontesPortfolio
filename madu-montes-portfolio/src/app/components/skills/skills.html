<div class="container">
  <span>Professional development</span>

  <h1>My skills</h1>

  <div class="skills-grid">

    <div class="skill-card" *ngFor="let skill of skills">

      <div class="top">
        <h3>{{ skill.name }}</h3>

        <span class="badge">
          {{ skill.level }}%
        </span>
      </div>

      <div class="progress">
        <div class="fill" [style.width.%]="skill.level">
        </div>
      </div>

    </div>

  </div>
</div>
